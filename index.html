<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Console</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        #sendTo {
            min-height: 150px;
        }

        #emailBody {
            min-height: 220px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #111827;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f8fafc;
            display: none;
        }

        .status-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 18px;
        }

        .stat {
            font-size: 15px;
        }

        .results {
            margin-top: 15px;
        }

        .result {
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .success {
            color: #15803d;
        }

        .failure {
            color: #dc2626;
        }

        .sending {
            color: #b45309;
        }

        .hint {
            margin-top: 6px;
            color: #6b7280;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mail Console</h1>

    <div class="form-group">
        <label for="sendFrom">Send From</label>
        <input
            type="email"
            id="sendFrom"
            placeholder="sender@example.com"
        >
        <div class="hint">You can change the sender address for each batch.</div>
    </div>

    <div class="form-group">
        <label for="sendTo">Send To — Multiple Recipients</label>
        <textarea
            id="sendTo"
            placeholder="recipient1@example.com&#10;recipient2@example.com&#10;recipient3@example.com"
        ></textarea>
        <div class="hint">Enter one email address per line. Messages are sent 10 seconds apart.</div>
    </div>

    <div class="form-group">
        <label for="replyTo">Reply-To</label>
        <input
            type="email"
            id="replyTo"
            placeholder="reply@example.com"
        >
    </div>

    <div class="form-group">
        <label for="subject">Subject</label>
        <input
            type="text"
            id="subject"
            placeholder="Email subject"
        >
    </div>

    <div class="form-group">
        <label for="emailBody">Email Body</label>
        <textarea
            id="emailBody"
            placeholder="Write your email here..."
        ></textarea>
    </div>

    <button type="button" id="sendButton" onclick="startSending()">
        SEND EMAILS
    </button>

    <div class="status" id="statusBox">
        <div class="status-title" id="statusTitle">Ready</div>

        <div class="stats">
            <div class="stat">
                Sent: <strong id="sentCount">0</strong>
            </div>

            <div class="stat">
                Not Sent: <strong id="failedCount">0</strong>
            </div>

            <div class="stat">
                Total: <strong id="totalCount">0</strong>
            </div>
        </div>

        <div id="progress"></div>

        <div class="results" id="results"></div>
    </div>
</div>

<script>
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function startSending() {
    const sendButton = document.getElementById("sendButton");
    const statusBox = document.getElementById("statusBox");
    const statusTitle = document.getElementById("statusTitle");
    const sentCount = document.getElementById("sentCount");
    const failedCount = document.getElementById("failedCount");
    const totalCount = document.getElementById("totalCount");
    const progress = document.getElementById("progress");
    const results = document.getElementById("results");

    const sendFrom = document.getElementById("sendFrom").value.trim();
    const rawTo = document.getElementById("sendTo").value;
    const replyTo = document.getElementById("replyTo").value.trim();
    const subject = document.getElementById("subject").value;
    const body = document.getElementById("emailBody").value;

    const recipients = rawTo
        .split(/\r?\n/)
        .map(email => email.trim())
        .filter(email => email.length > 0);

    if (!sendFrom) {
        alert("Please enter a Send From email address.");
        return;
    }

    if (recipients.length === 0) {
        alert("Please enter at least one recipient email address.");
        return;
    }

    if (!subject.trim()) {
        alert("Please enter a subject.");
        return;
    }

    if (!body.trim()) {
        alert("Please enter an email body.");
        return;
    }

    sendButton.disabled = true;
    sendButton.textContent = "SENDING...";

    statusBox.style.display = "block";
    statusTitle.textContent = "Sending Batch";
    sentCount.textContent = "0";
    failedCount.textContent = "0";
    totalCount.textContent = recipients.length;
    progress.textContent = "";
    results.innerHTML = "";

    let sent = 0;
    let failed = 0;

    for (let i = 0; i < recipients.length; i++) {
        const recipient = recipients[i];

        progress.innerHTML =
            `<strong>Sending ${i + 1} of ${recipients.length}</strong>` +
            (i > 0 ? " — 10-second throttle active" : "");

        const resultRow = document.createElement("div");
        resultRow.className = "result sending";
        resultRow.textContent =
            `→ ${recipient}  Sending...`;

        results.appendChild(resultRow);

        try {
            const response = await fetch("/api/send", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    from: sendFrom,
                    to: [recipient],
                    reply_to: replyTo,
                    subject: subject,
                    body: body
                })
            });

            let data = {};

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            if (response.ok) {
                sent++;

                sentCount.textContent = sent;

                resultRow.className = "result success";
                resultRow.textContent =
                    `✓ ${recipient}  Sent`;
            } else {
                failed++;

                failedCount.textContent = failed;

                let errorMessage = "Send failed";

                if (data.error) {
                    if (typeof data.error === "string") {
                        errorMessage = data.error;
                    } else if (Array.isArray(data.error)) {
                        errorMessage = data.error
                            .map(e => e.message || JSON.stringify(e))
                            .join(", ");
                    } else {
                        errorMessage = JSON.stringify(data.error);
                    }
                }

                resultRow.className = "result failure";
                resultRow.textContent =
                    `✕ ${recipient}  ${errorMessage}`;
            }

        } catch (error) {
            failed++;

            failedCount.textContent = failed;

            resultRow.className = "result failure";
            resultRow.textContent =
                `✕ ${recipient}  ${error.message}`;
        }

        /*
         * Wait 10 seconds before sending the next recipient.
         * No delay is needed after the final recipient.
         */
        if (i < recipients.length - 1) {
            for (let seconds = 10; seconds > 0; seconds--) {
                progress.innerHTML =
                    `<strong>Completed ${i + 1} of ${recipients.length}</strong>` +
                    ` — next send in ${seconds}s`;

                await sleep(1000);
            }
        }
    }

    statusTitle.textContent = "Batch Complete";

    progress.innerHTML =
        `<strong>Finished.</strong> ${sent} sent, ${failed} not sent.`;

    sendButton.disabled = false;
    sendButton.textContent = "SEND EMAILS";

    /*
     * Clear only the recipient box after the batch finishes.
     * Keep the other fields so another batch can be prepared quickly.
     */
    document.getElementById("sendTo").value = "";
}
</script>

</body>
</html>
